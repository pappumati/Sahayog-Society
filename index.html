<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sahyog Society</title>
<meta name="theme-color" content="#24304A">
<link rel="manifest" href="./manifest.json">
<link rel="stylesheet" href="./css/styles.css">

<!-- Safety net: if the app can't draw anything (e.g. Google's Firebase files
     are blocked or the connection is bad), say WHY instead of a blank screen. -->
<script>
(function(){
  var errs = [];
  function esc(t){ return String(t).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  window.addEventListener('error', function(e){
    var t = e.target;
    if(t && t !== window && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')){
      errs.push('Could not load: ' + (t.src || t.href));
    } else {
      errs.push((e.message || 'Script error') + (e.filename ? '  (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : ''));
    }
  }, true);
  window.addEventListener('unhandledrejection', function(e){
    var r = e.reason;
    errs.push('Promise error: ' + ((r && (r.code || r.message)) || r));
  });
  setTimeout(function(){
    var app = document.getElementById('app');
    if(!app || app.innerHTML.replace(/\s/g,'') !== '') return; // app drew something - all good
    var why;
    if(typeof firebase === 'undefined'){
      why = "Google's Firebase files (gstatic.com) could not be loaded. Check that your internet works, try switching between Wi-Fi and mobile data, and turn off any ad-blocker or data-saver mode for this site.";
    } else if(errs.length){
      why = 'A script error stopped the app from starting. Details are below - please send a screenshot.';
    } else {
      why = 'Still connecting to Google servers - the connection looks very slow or blocked. Please try again.';
    }
    app.innerHTML =
      '<div style="max-width:380px;margin:16vh auto 0;padding:0 22px;font-family:system-ui,sans-serif;color:#24304A;text-align:center;">' +
      '<div style="width:56px;height:56px;border-radius:50%;border:2px solid #24304A;margin:0 auto 14px;line-height:52px;font-weight:700;font-size:20px;">SS</div>' +
      '<div style="font-size:19px;font-weight:700;margin-bottom:8px;">Sahyog Society could not start</div>' +
      '<div style="font-size:14px;line-height:1.55;margin-bottom:18px;">' + esc(why) + '</div>' +
      '<button onclick="location.reload()" style="background:#24304A;color:#FBF8EF;border:none;border-radius:10px;padding:11px 26px;font-size:15px;font-weight:600;">Try again</button>' +
      (errs.length ? '<details style="margin-top:18px;text-align:left;font-size:11.5px;"><summary>Technical details</summary><pre style="white-space:pre-wrap;word-break:break-word;">' + esc(errs.join('\n')) + '</pre></details>' : '') +
      '</div>';
  }, 8000);
})();
</script>
</head>
<body data-theme="bahi">
  <div id="app"></div>

  <!-- Firebase (compat SDK — simplest for a single-file style app) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script src="./js/firebase-config.js"></script>
  <script src="./js/utils.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/members.js"></script>
  <script src="./js/contributions.js"></script>
  <script src="./js/loans.js"></script>
  <script src="./js/reminders.js"></script>
  <script src="./js/reports.js"></script>
  <script src="./js/yearend.js"></script>
  <script src="./js/dashboard.js"></script>
  <script src="./js/settings.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
