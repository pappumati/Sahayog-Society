<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sahyog Society - Connection Diagnostic</title>
<style>
  body{font-family:system-ui,sans-serif; max-width:640px; margin:0 auto; padding:18px; background:#F3EEE0; color:#24304A;}
  h1{font-size:19px;}
  input{width:100%; padding:10px; margin:6px 0 12px; border:1px solid #C9BFA0; border-radius:8px; box-sizing:border-box; font-size:15px;}
  button{background:#24304A; color:#FBF8EF; border:none; border-radius:8px; padding:11px 18px; font-size:15px; font-weight:600;}
  .line{padding:8px 10px; margin:6px 0; border-radius:6px; font-size:13.5px; white-space:pre-wrap; word-break:break-word; font-family:ui-monospace,Consolas,monospace;}
  .ok{background:#E1EFE3; color:#1E5E33;}
  .fail{background:#F6DEDE; color:#8C2F39;}
  .info{background:#EFE7D0; color:#24304A;}
</style>
</head>
<body>
  <h1>Sahyog Society - Connection Diagnostic</h1>
  <p style="font-size:13px;">This page talks directly to your real Firebase project and shows exactly what happens at each step. It does not change any data. Screenshot the results below and send them back.</p>
  <label>Username</label>
  <input id="u" value="admin" autocapitalize="off">
  <label>Password</label>
  <input id="p" type="password" placeholder="your password">
  <button onclick="run()">Run Diagnostic</button>
  <div id="out" style="margin-top:16px;"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="./js/firebase-config.js"></script>
  <script>
    function line(cls, text){
      const d = document.createElement('div');
      d.className = 'line ' + cls;
      d.textContent = text;
      document.getElementById('out').appendChild(d);
    }
    async function run(){
      document.getElementById('out').innerHTML = '';
      line('info', 'Project ID in firebase-config.js: ' + (firebaseConfig.projectId || '(missing)'));
      line('info', 'Auth domain: ' + (firebaseConfig.authDomain || '(missing)'));

      const email = document.getElementById('u').value.trim().toLowerCase().replace(/[^a-z0-9._-]/g,'') + '@sahyog.local';
      const pass = document.getElementById('p').value;

      // Step 1: sign in
      let user;
      try{
        const cred = await auth.signInWithEmailAndPassword(email, pass);
        user = cred.user;
        line('ok', 'STEP 1 - Sign in: SUCCESS\nUID: ' + user.uid + '\nEmail: ' + user.email);
      }catch(e){
        line('fail', 'STEP 1 - Sign in: FAILED\n' + e.code + ': ' + e.message);
        line('info', 'Stopping here - if sign-in fails, everything after it will fail too. This means the password does not match this username in Firebase Auth.');
        return;
      }

      // Step 2: inspect the actual ID token being sent with every request
      try{
        const tokenResult = await user.getIdTokenResult(true);
        line('ok', 'STEP 2 - ID token: OBTAINED\nissuer (iss): ' + tokenResult.claims.iss + '\naudience (aud): ' + tokenResult.claims.aud + '\nauth_time: ' + new Date(tokenResult.claims.auth_time*1000).toString() + '\nexpires: ' + tokenResult.expirationTime);
      }catch(e){
        line('fail', 'STEP 2 - ID token: FAILED\n' + e.code + ': ' + e.message);
      }

      // Step 3: try an actual Firestore read - this is the one that has been failing
      try{
        const snap = await db.collection('members').limit(1).get();
        line('ok', 'STEP 3 - Firestore read: SUCCESS\nDocuments returned: ' + snap.size + (snap.size ? '\nFirst doc: ' + JSON.stringify(snap.docs[0].data()) : ' (collection reachable but empty)'));
      }catch(e){
        line('fail', 'STEP 3 - Firestore read: FAILED\n' + e.code + ': ' + e.message);
      }

      // Step 4: try a Firestore WRITE (a harmless throwaway doc) to see if it's read-only vs fully blocked
      try{
        await db.collection('_diagnostic').doc('ping').set({at: new Date().toISOString()});
        line('ok', 'STEP 4 - Firestore write: SUCCESS (wrote to a throwaway "_diagnostic" collection - safe to ignore/delete)');
      }catch(e){
        line('fail', 'STEP 4 - Firestore write: FAILED\n' + e.code + ': ' + e.message);
      }

      await auth.signOut();
      line('info', 'Signed out. Diagnostic complete - please screenshot everything above.');
    }
  </script>
</body>
</html>
